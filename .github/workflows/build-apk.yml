name: Build & Publish Zephyr Weather APK to GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g., v2.7.0)'
        required: false
        default: 'v2.7.0'

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Installable APK (ZephyrWeather.apk)
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ZephyrWeather.apk
          cp app/build/outputs/apk/debug/app-debug.apk ZephyrWeather-v2.7.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZephyrWeather-APK
          path: |
            ZephyrWeather.apk
            ZephyrWeather-v2.7.0.apk

      - name: Update Direct Download APK in Repository Root
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZephyrWeather.apk
          git diff --staged --quiet || git commit -m "chore: update direct download ZephyrWeather.apk (v2.7.0) [skip ci]"
          git push

      - name: Publish APK to GitHub Releases (v2.7.0 / Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.7.0' }}
          name: "Zephyr Weather v2.7.0 — 4-Model Ensemble & HyperOS Zero-Wakelock Battery Engine"
          make_latest: true
          files: |
            ZephyrWeather.apk
            ZephyrWeather-v2.7.0.apk
          body: |
            ## 🌤️ Zephyr Weather v2.7.0 (Build 27)
            ### 🔋 HyperOS / MIUI Zero-Wakelock Battery Engine (Redmi Note 15 Pro 5G Optimized)
            - **0m Background Keep-Awake**: Removed `AlarmManager.ELAPSED_REALTIME_WAKEUP` and recursive `JobScheduler` rescheduling loops so your phone sleeps deeply in Doze mode with zero wakelock drain.
            - **Lifecycle-Paused 120Hz Canvas & Clock Engine**: Automatically pauses all atmospheric particle systems, hero badge orbital rings, radar sweeps, and minute-aligned clock timers the instant the screen turns off or the app enters the background (`~70 MB RAM`).
            - **Immediate GPS Hardware Release**: Cancels `FusedLocationProviderClient` tokens on completion and uses balanced power accuracy when Battery Saver is active.

            ### 🛰️ 4-Model Super-Ensemble Forecasting
            - Fuses **HR-LAM Best-Match (1–2 km)** + **ECMWF IFS 0.25° (9 km)** + **DWD ICON Seamless (2–7 km)** + **NOAA GFS Seamless (13–25 km)** with outlier dampening, altitude lapse-rate temperature calibration (`-6.5°C / 1000m`), and dew-point wet-bulb snow physics.

            ### 🔄 Built-In GitHub Releases App Updater
            - Check for new versions and download the latest `ZephyrWeather.apk` directly inside **Settings → GitHub Releases App Updater**.
