name: Build & Publish Zephyr Weather APK to GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g., v2.9.0)'
        required: false
        default: 'v2.9.0'

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Installable APK (ZephyrWeather.apk)
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ZephyrWeather.apk
          cp app/build/outputs/apk/debug/app-debug.apk ZephyrWeather-v2.9.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZephyrWeather-APK
          path: |
            ZephyrWeather.apk
            ZephyrWeather-v2.9.0.apk

      - name: Update Direct Download APK in Repository Root
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZephyrWeather.apk
          git diff --staged --quiet || git commit -m "chore: update direct download ZephyrWeather.apk (v2.9.0) [skip ci]"
          git push

      - name: Publish APK to GitHub Releases (v2.9.0 / Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.9.0' }}
          name: "Zephyr Weather v2.9.0 — 4-Model Ensemble, Instant GPS & Best Performance for All Devices"
          make_latest: true
          files: |
            ZephyrWeather.apk
            ZephyrWeather-v2.9.0.apk
          body: |
            ## 🌤️ Zephyr Weather v2.9.0 (Build 28) — Universal High-Performance Release
            ### ⚡ Maximum Performance & Battery Efficiency Across All Android Devices
            - **Universal 60Hz / 90Hz / 120Hz Smooth Rendering**: Draw-phase Compose weather animations and lifecycle-aware frame scheduling deliver silky-smooth visuals across all Android phones and tablets while using minimal RAM (`~70 MB`).
            - **Zero Background Drain**: Doze-friendly `JobScheduler` synchronization and automatic `ON_STOP` lifecycle pausing ensure zero background CPU keep-awake when your screen is off.
            - **Sub-100ms Fast-Path GPS Location**: Immediately checks cached OS `LocationManager` & `FusedLocationProviderClient.lastLocation` before requesting a fresh hardware fix, paired with parallel 1.2s reverse-geocoding.
            - **Transparent Glass Navigation Bar & 3D Icons**: Full-opacity 3D navigation bar icons over a crystal-transparent glass bar.

            ### 🛰️ 4-Model Super-Ensemble Forecasting
            - Fuses **HR-LAM Best-Match (1–2 km)** + **ECMWF IFS 0.25° (9 km)** + **DWD ICON Seamless (2–7 km)** + **NOAA GFS Seamless (13–25 km)** with outlier dampening, altitude lapse-rate temperature calibration (`-6.5°C / 1000m`), and dew-point wet-bulb snow physics.
