name: Publish Zephyr Weather APK to GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Prebuilt ZephyrWeather.1.apk
        run: |
          if [ -f "ZephyrWeather.1.apk" ]; then
            ls -lh ZephyrWeather.1.apk
          elif [ -f "ZephyrWeather.apk" ]; then
            cp ZephyrWeather.apk ZephyrWeather.1.apk
            ls -lh ZephyrWeather.1.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZephyrWeather-1-APK
          path: ZephyrWeather.1.apk

      - name: Clean Old ZephyrWeather.apk & Publish New ZephyrWeather.1.apk to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌤️ Zephyr Weather v3.0.0 (Build 30) — Official Release

          ### 📲 [⬇️ DOWNLOAD `ZephyrWeather.1.apk` HERE ⬇️](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)

          [![Download APK](https://img.shields.io/badge/%E2%AC%87%EF%B8%8F_DOWNLOAD_APK-ZephyrWeather.1.apk_(v3.0.0)-10B981?style=for-the-badge&logo=android&logoColor=white)](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)

          ---

          ### 🚀 [What's New in v3.0.0 — Full Changelog (Tap to Download `ZephyrWeather.1.apk`)](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)
          - **[Interactive Doppler Radar Zoom (`1.0×` – `5.0×`)](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)**: Pinch-to-zoom, double-tap zoom, drag-to-pan, floating `+` / `1×` / `−` buttons, continuous zoom slider, 4 satellite tile detail levels (`16x` Streets to `9x` Region), and live Marshall-Palmer dBZ reflectivity telemetry.
          - **[Night Sky Visible Star Count (`0` – `3,500` Stars)](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)**: Real-time naked-eye visible star counter, sky clarity %, limiting magnitude (`Mag`), synodic lunar illumination %, and best stargazing window calculated from cloud cover, humidity, PM2.5 aerosols, visibility, and altitude.
          - **[15-Minute Sub-Hourly Forecast Accuracy & 4-Model Super-Ensemble](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)**: Fuses **HR-LAM Best-Match (1–2 km)** + **ECMWF IFS 0.25° (9 km)** + **DWD ICON Seamless (2–7 km)** + **NOAA GFS Seamless (13–25 km)** with exact 15-minute sub-hourly nowcast matching (`:00`, `:15`, `:30`, `:45`).
          - **[Instant Saved-City Startup & Sub-100ms GPS](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)**: Launches immediately into your saved city on frame 1 with zero loading screens or repeated location prompts.
          - **[Transparent Glass Navigation Bar & Universal High Performance](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)**: Full-color 3D navigation bar icons over a transparent glass bar, smooth 60Hz/90Hz/120Hz rendering, and ultra-low battery usage across all Android devices.

          **Full Changelog & Direct APK Download**: [Download `ZephyrWeather.1.apk` (v3.0.0)](https://github.com/${{ github.repository }}/releases/latest/download/ZephyrWeather.1.apk)
          EOF

          # If existing 'zephyrweather' release exists, remove old ZephyrWeather.apk (keep ZephyrWeather.1.apk) and update notes
          if gh release view zephyrweather >/dev/null 2>&1; then
            gh release delete-asset zephyrweather ZephyrWeather.apk --yes || true
            gh release upload zephyrweather ZephyrWeather.1.apk --clobber
            gh release edit zephyrweather --title "Zephyr Weather v3.0.0 — Radar Zoom, Star Count & 4-Model Ensemble" --notes-file release_notes.md --latest
          else
            gh release create zephyrweather ZephyrWeather.1.apk --title "Zephyr Weather v3.0.0 — Radar Zoom, Star Count & 4-Model Ensemble" --notes-file release_notes.md --latest
          fi
