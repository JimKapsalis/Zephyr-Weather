name: Build & Publish Zephyr Weather APK to GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g., v3.0.0)'
        required: false
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Installable APK (ZephyrWeather.apk)
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ZephyrWeather.apk
          cp app/build/outputs/apk/debug/app-debug.apk ZephyrWeather-v3.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZephyrWeather-APK
          path: |
            ZephyrWeather.apk
            ZephyrWeather-v3.0.0.apk

      - name: Update Direct Download APK in Repository Root
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZephyrWeather.apk
          git diff --staged --quiet || git commit -m "chore: update direct download ZephyrWeather.apk (v3.0.0) [skip ci]"
          git push

      - name: Publish APK to GitHub Releases (v3.0.0 / Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v3.0.0' }}
          name: "Zephyr Weather v3.0.0 — 4-Model Ensemble, Instant Startup & Universal High Performance"
          make_latest: true
          files: |
            ZephyrWeather.apk
            ZephyrWeather-v3.0.0.apk
          body: |
            ## 🌤️ Zephyr Weather v3.0.0 (Build 30) — Official Release

            ### 📲 Direct APK Download
            Tap **`ZephyrWeather.apk`** under **Assets** below to install or update on any Android phone or tablet.

            ---

            ### 🚀 What's New in v3.0.0 (Changelog)
            - **Instant Saved-City Startup**: Launches immediately into your saved city's forecast on frame 1 while refreshing in the background — no loading skeletons or repeated location prompts when reopening the app.
            - **Sub-100ms Fast-Path GPS Location**: Resolves cached OS `LocationManager` and `FusedLocationProviderClient.lastLocation` coordinates first before racing live providers, paired with fast parallel 1.2s reverse-geocoding.
            - **Universal 60Hz / 90Hz / 120Hz High-Performance Rendering**: Smooth draw-phase Compose weather animations, zero per-frame list recompositions, and a lightweight `~70 MB` RAM footprint across all Android devices.
            - **Ultra-Low Battery Usage**: Uses Android's Doze-aware `JobScheduler` and automatic `ON_STOP` lifecycle pausing so all particle canvases, clocks, and background tasks sleep completely when your screen is off.
            - **Crystal-Transparent Navigation Bar & 3D Animated Icons**: Full-color 3D navigation bar icons (`Forecast`, `Radar`, `Cities`, `Settings`) over a transparent glass navigation bar.
            - **4-Model Super-Ensemble Forecasting**: Blends **HR-LAM Best-Match (1–2 km)** + **ECMWF IFS 0.25° (9 km)** + **DWD ICON Seamless (2–7 km)** + **NOAA GFS Seamless (13–25 km)** with outlier dampening, altitude lapse-rate calibration (`-6.5°C / 1000m`), and wet-bulb snow physics.
            - **Built-In GitHub Releases App Updater**: Check for new versions and download the latest `ZephyrWeather.apk` directly inside **Settings → GitHub Releases App Updater**.
